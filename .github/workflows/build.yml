name: build-image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (the image is ~10 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/ming-tts-runpod
          docker build -t $IMG:latest -t $IMG:${GITHUB_SHA::7} .
          docker push $IMG:latest
          docker push $IMG:${GITHUB_SHA::7}
          echo "pushed $IMG:${GITHUB_SHA::7}"
